<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>College Recommendation System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Inter", sans-serif;
            background: #eef2f0;
        }

        .auth-card {
            display: flex;
            width: 100%;
            max-width: 980px;
            min-height: 620px;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.08);
        }

        .illustration-panel {
            flex: 1;
            background: #d8eee8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 40px;
            text-align: center;
        }

        .illustration-panel svg {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin-bottom: 32px;
        }

        .illustration-panel h2 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .illustration-panel p {
            font-size: 0.92rem;
            color: #666;
            line-height: 1.6;
            max-width: 280px;
        }

        .dots {
            display: flex;
            gap: 8px;
            margin-top: 36px;
        }

        .dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .dots span.active {
            width: 24px;
            border-radius: 4px;
            background: #1a1a1a;
        }

        .form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 56px;
        }

        .form-wrapper {
            width: 100%;
            max-width: 340px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .brand-name {
            font-family: "DM Serif Display", serif;
            font-size: 1.75rem;
            letter-spacing: 0.04em;
            color: #1a1a1a;
        }

        .brand-icon {
            font-size: 1.4rem;
        }

        .welcome-text {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 36px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field-group {
            margin-bottom: 24px;
        }

        .field-group label {
            display: block;
            font-size: 0.78rem;
            color: #999;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .field-group input {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #ddd;
            padding: 8px 0;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1a1a1a;
            background: transparent;
            outline: none;
            transition: border-color 0.2s;
        }

        .field-group input:focus {
            border-bottom-color: #5cb89a;
        }

        .field-group input::placeholder {
            color: #bbb;
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.82rem;
            color: #5cb89a;
            text-decoration: none;
            margin-bottom: 28px;
            font-weight: 500;
            cursor: pointer;
        }

        .forgot-link:hover {
            color: #3d9a7c;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: #1a1a1a;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .submit-btn:hover {
            background: #333;
            transform: translateY(-1px);
        }

        .footer-link {
            text-align: center;
            margin-top: 28px;
            font-size: 0.85rem;
            color: #888;
        }

        .footer-link a {
            color: #5cb89a;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .footer-link a:hover {
            color: #3d9a7c;
            text-decoration: underline;
        }

        .notification {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            max-width: 420px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 500;
            line-height: 1.45;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            transform: translateX(calc(100% + 32px));
            opacity: 0;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        .notification.show {
            transform: translateX(0);
            opacity: 1;
        }

        .notification.error {
            background: #fff5f5;
            color: #c0392b;
            border: 1px solid #fadbd8;
        }

        .notification.success {
            background: #f0faf5;
            color: #1e8449;
            border: 1px solid #d5f5e3;
        }

        .notification-icon {
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .notification-text {
            flex: 1;
        }

        .notification-close {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: inherit;
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0.6;
            padding: 0 2px;
        }

        .notification-close:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .notification {
                left: 16px;
                right: 16px;
                min-width: auto;
                max-width: none;
                transform: translateY(calc(-100% - 32px));
            }

            .notification.show {
                transform: translateY(0);
            }

            .auth-card {
                flex-direction: column;
                min-height: auto;
            }

            .illustration-panel {
                padding: 32px 24px;
            }

            .illustration-panel svg {
                max-width: 200px;
                margin-bottom: 20px;
            }

            .form-panel {
                padding: 36px 28px 44px;
            }
        }
    </style>
</head>
<body>

    <div id="notification" class="notification" role="alert" aria-live="assertive">
        <span class="notification-icon" id="notification-icon">⚠</span>
        <span class="notification-text" id="notification-text"></span>
        <button type="button" class="notification-close" onclick="hideNotification()" aria-label="Close">&times;</button>
    </div>

    <div class="auth-card">
        <div class="illustration-panel">
            <svg viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="40" y="160" width="80" height="60" rx="4" stroke="#1a1a1a" stroke-width="2" fill="none"/>
                <rect x="50" y="170" width="20" height="30" rx="2" stroke="#1a1a1a" stroke-width="1.5" fill="#fff"/>
                <rect x="75" y="175" width="15" height="25" rx="2" stroke="#1a1a1a" stroke-width="1.5" fill="#fff"/>
                <rect x="95" y="180" width="18" height="20" rx="2" stroke="#1a1a1a" stroke-width="1.5" fill="#fff"/>
                <path d="M60 160 L80 130 L100 160" stroke="#1a1a1a" stroke-width="2" fill="none"/>
                <circle cx="200" cy="100" r="28" stroke="#1a1a1a" stroke-width="2" fill="#fff"/>
                <path d="M185 95 Q200 80 215 95" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
                <circle cx="192" cy="98" r="3" fill="#1a1a1a"/>
                <circle cx="208" cy="98" r="3" fill="#1a1a1a"/>
                <path d="M192 108 Q200 114 208 108" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
                <rect x="175" y="128" width="50" height="70" rx="6" stroke="#1a1a1a" stroke-width="2" fill="#fff"/>
                <line x1="185" y1="145" x2="215" y2="145" stroke="#5cb89a" stroke-width="2"/>
                <line x1="185" y1="158" x2="210" y2="158" stroke="#5cb89a" stroke-width="2"/>
                <rect x="220" y="155" width="60" height="65" rx="4" stroke="#1a1a1a" stroke-width="2" fill="none"/>
                <rect x="230" y="165" width="18" height="28" rx="2" stroke="#1a1a1a" stroke-width="1.5" fill="#fff"/>
                <rect x="252" y="170" width="14" height="23" rx="2" stroke="#1a1a1a" stroke-width="1.5" fill="#fff"/>
                <rect x="270" y="175" width="16" height="18" rx="2" stroke="#1a1a1a" stroke-width="1.5" fill="#fff"/>
                <path d="M240 155 L255 125 L270 155" stroke="#1a1a1a" stroke-width="2" fill="none"/>
                <circle cx="130" cy="90" r="26" stroke="#1a1a1a" stroke-width="2" fill="#fff"/>
                <rect x="115" y="70" width="30" height="8" rx="3" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
                <circle cx="122" cy="88" r="2.5" fill="#1a1a1a"/>
                <circle cx="138" cy="88" r="2.5" fill="#1a1a1a"/>
                <path d="M122 98 Q130 104 138 98" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
                <rect x="108" y="116" width="44" height="55" rx="6" stroke="#1a1a1a" stroke-width="2" fill="#fff"/>
                <line x1="118" y1="130" x2="142" y2="130" stroke="#5cb89a" stroke-width="2"/>
                <line x1="118" y1="142" x2="138" y2="142" stroke="#5cb89a" stroke-width="2"/>
                <path d="M90 200 L230 200" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
            </svg>
            <h2 id="panel-title">Find Your Perfect College</h2>
            <p id="panel-subtitle">Get personalized college recommendations based on your cutoff score and preferences.</p>
            <div class="dots">
                <span class="active" id="dot-0"></span>
                <span id="dot-1"></span>
                <span id="dot-2"></span>
            </div>
        </div>

        <div class="form-panel">
            <div class="form-wrapper">
                
                <p class="welcome-text" id="welcome-text">Welcome</p>

                <!-- Login Form (shown first) -->
                <form id="login-form" class="auth-form active" action="/login" method="post">
                    <div class="field-group">
                        <label for="login-usermail">Username or email</label>
                        <input type="text" id="login-usermail" name="usermail" placeholder="Enter your email" required>
                    </div>
                    <div class="field-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                    </div>
                    <a class="forgot-link" onclick="switchForm('forget-password-form')">Forgot password?</a>
                    <input type="submit" class="submit-btn" value="Sign In">
                    <p class="footer-link">Are you new? <a onclick="switchForm('register-form')">Create an Account</a></p>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="auth-form" action="/register" method="post">
                    <div class="field-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" name="username" placeholder="Choose a username" required>
                    </div>
                    <div class="field-group">
                        <label for="reg-usermail">Email</label>
                        <input type="email" id="reg-usermail" name="usermail" placeholder="Enter your email" required>
                    </div>
                    <div class="field-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" name="password" placeholder="Create a password" required>
                    </div>
                    <input type="submit" class="submit-btn" value="Create Account">
                    <p class="footer-link">Already have an account? <a onclick="switchForm('login-form')">Sign In</a></p>
                </form>

                <!-- Reset Password Form -->
                <form id="forget-password-form" class="auth-form" action="/reset_password" method="post" onsubmit="return validatePassword()">
                    <div class="field-group">
                        <label for="reset-usermail">Email</label>
                        <input type="email" id="reset-usermail" name="usermail" placeholder="Enter your registered email" required>
                    </div>
                    <div class="field-group">
                        <label for="newpassword">New Password</label>
                        <input type="password" id="newpassword" name="newpassword" placeholder="Enter new password" required>
                    </div>
                    <div class="field-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
                    </div>
                    <input type="submit" class="submit-btn" value="Reset Password">
                    <p class="footer-link">Remember your password? <a onclick="switchForm('login-form')">Sign In</a></p>
                </form>
            </div>
        </div>
    </div>

    <script>
        var notificationTimer = null;

        function showNotification(message, type) {
            var notification = document.getElementById('notification');
            var icon = document.getElementById('notification-icon');
            var text = document.getElementById('notification-text');

            notification.classList.remove('error', 'success', 'show');
            notification.classList.add(type === 'success' ? 'success' : 'error');
            icon.textContent = type === 'success' ? '✓' : '⚠';
            text.textContent = message;

            if (notificationTimer) {
                clearTimeout(notificationTimer);
            }

            requestAnimationFrame(function() {
                notification.classList.add('show');
            });

            notificationTimer = setTimeout(hideNotification, 5000);
        }

        function hideNotification() {
            var notification = document.getElementById('notification');
            notification.classList.remove('show');
            if (notificationTimer) {
                clearTimeout(notificationTimer);
                notificationTimer = null;
            }
        }

        var panelContent = {
            'login-form': {
                title: 'Find Your Perfect College',
                subtitle: 'Get personalized college recommendations based on your cutoff score and preferences.',
                welcome: 'Welcome',
                dot: 0
            },
            'register-form': {
                title: 'Start Your Journey',
                subtitle: 'Create an account to explore colleges and departments tailored to your profile.',
                welcome: 'Create your account',
                dot: 1
            },
            'forget-password-form': {
                title: 'Reset Your Password',
                subtitle: 'Enter your registered email and choose a new password to regain access.',
                welcome: 'Forgot your password?',
                dot: 2
            }
        };

        function switchForm(formId) {
            document.querySelectorAll('.auth-form').forEach(function(form) {
                form.classList.toggle('active', form.id === formId);
            });

            var content = panelContent[formId];
            if (content) {
                document.getElementById('panel-title').textContent = content.title;
                document.getElementById('panel-subtitle').textContent = content.subtitle;
                document.getElementById('welcome-text').textContent = content.welcome;

                document.querySelectorAll('.dots span').forEach(function(dot, i) {
                    dot.classList.toggle('active', i === content.dot);
                });
            }
        }

        function validatePassword() {
            var newPassword = document.getElementById('newpassword').value;
            var confirmPassword = document.getElementById('confirm_password').value;

            if (newPassword !== confirmPassword) {
                showNotification('Password does not match!', 'error');
                return false;
            }
            return true;
        }

        {% if error %}
        document.addEventListener('DOMContentLoaded', function() {
            switchForm('{{ active_form or "login-form" }}');
            showNotification({{ error|tojson }}, 'error');
        });
        {% endif %}

        window.addEventListener("pageshow", function (event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
</body>
</html>
